name: CI

# 開發用驗證流水線：lint / unit test / rules test / build / functions test / audit。
# 全程只連本機 Firebase Emulator(rules test)或使用假的測試環境變數(build)，
# 不會部署、也不會連到正式 Firebase 專案。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # 假的測試用 Firebase 設定值 —— 只是為了讓 vite build 通過必要環境變數檢查，
      # 不會、也不能連到任何正式的 Firebase 專案
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (Firestore/Storage emulator 需要)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install firebase-tools (emulators:exec 用，專案本身不依賴它)
        run: npm install -g firebase-tools

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (test env vars, 不連正式 Firebase 專案)
        run: npm run build

      # test:rules 除了跑 Firestore/Storage rules 測試，還會跑 functions/test/renameUserLogin.test.js
      # 和 functions/test/resolveActivePlannerCcEmails.test.js 這兩個整合測試(直接 import firebase-admin)。
      # 這個 job 跟下面的 functions job 是各自獨立的 runner，彼此的 node_modules 不會共用，
      # 所以這裡一定要自己裝一次 functions/ 的依賴，不能假設 functions job 裝好的東西這裡看得到。
      - name: Install functions dependencies (test:rules 的整合測試需要 firebase-admin)
        run: npm ci --prefix functions

      - name: Rules tests (Firestore + Storage emulator)
        run: npm run test:rules

      # 目前有 2 個 high severity 已知風險(react-router GHSA-qwww-vcr4-c8h2，RSC Mode CSRF
      # Bypass)：`npm audit fix --force` 唯一的修法是降版到 react-router-dom@7.11.0(breaking
      # change)。這個網站沒有使用 RSC(React Server Components)/SSR，這個漏洞的攻擊面
      # 不適用；接受風險、暫不處理，continue-on-error 只是避免這個已知、已評估過的問題
      # 擋住其他測試，不代表「通過」——exit code 仍是 1，實際結果見這個 step 的 log。
      - name: npm audit (frontend，已知 React Router 風險，非阻擋)
        run: npm audit
        continue-on-error: true

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # functions 目前是 0 vulnerabilities；continue-on-error 保留是為了避免未來新增依賴
      # 出現低風險項目時擋住整個 pipeline，不代表現在有已知風險被刻意放行。
      - name: npm audit (functions，目前 0 vulnerabilities)
        run: npm audit
        continue-on-error: true
