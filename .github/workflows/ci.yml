name: CI

# 開發用驗證流水線：lint / unit test / rules test / build / functions test / audit。
# 全程只連本機 Firebase Emulator(rules test)或使用假的測試環境變數(build)，
# 不會部署、也不會連到正式 Firebase 專案。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # 假的測試用 Firebase 設定值 —— 只是為了讓 vite build 通過必要環境變數檢查，
      # 不會、也不能連到任何正式的 Firebase 專案
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (Firestore/Storage emulator 需要)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install firebase-tools (emulators:exec 用，專案本身不依賴它)
        run: npm install -g firebase-tools

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (test env vars, 不連正式 Firebase 專案)
        run: npm run build

      - name: Rules tests (Firestore + Storage emulator)
        run: npm run test:rules

      - name: npm audit (frontend)
        run: npm audit
        continue-on-error: true

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: npm audit (functions)
        run: npm audit
        continue-on-error: true
